name: Build Blink Shell IPA (GPL Builder)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Blink version tag (e.g. v18.4.2)'
        required: false
        default: 'v18.4.2'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: "🔧 Environment Info"
        run: |
          sw_vers
          xcodebuild -version
          df -h /

      - name: "📦 Install Dependencies"
        run: brew install jq || true

      - name: "📥 Clone GPL Builder + Blink Source"
        run: |
          git clone https://github.com/NewsGuyTor/Blink-Shell-GPL-Builder.git builder
          cd builder
          chmod +x build-blink-shell-gpl.sh
          
          # Only setup/clone, don't build yet
          VERSION="${{ github.event.inputs.version }}"
          ./build-blink-shell-gpl.sh --setup-only --keep-source --version "$VERSION" 2>&1 | tee setup.log
          
          echo ""
          echo "=== Verify project file exists ==="
          ls -la blink-src/Blink.xcodeproj/project.pbxproj

      - name: "🔍 Validate project.pbxproj BEFORE build"
        run: |
          cd builder/blink-src
          echo "=== Validating project file ==="
          plutil -lint Blink.xcodeproj/project.pbxproj || {
            echo ""
            echo "⚠️ Project file is INVALID after patching!"
            echo "=== Attempting auto-fix ==="
            
            # Show the area around the error
            echo "=== Lines around 4278 ==="
            sed -n '4270,4290p' Blink.xcodeproj/project.pbxproj
            
            echo ""
            echo "=== Checking for common issues ==="
            # Check for missing semicolons in TEAM_ID replacements
            grep -n 'DEVELOPMENT_TEAM' Blink.xcodeproj/project.pbxproj | head -20
            
            # Fix: ensure all DEVELOPMENT_TEAM lines end with semicolon
            sed -i '' 's/DEVELOPMENT_TEAM = "[^"]*"$/DEVELOPMENT_TEAM = "";/' Blink.xcodeproj/project.pbxproj
            sed -i '' 's/DEVELOPMENT_TEAM = [^;]*$/&;/' Blink.xcodeproj/project.pbxproj
            
            # Fix: remove any double semicolons
            sed -i '' 's/;;/;/g' Blink.xcodeproj/project.pbxproj
            
            echo ""
            echo "=== Re-validating ==="
            plutil -lint Blink.xcodeproj/project.pbxproj || {
              echo "❌ Still invalid. Showing full diff of changes..."
              echo "=== Last 5 git changes ==="
              git diff --stat HEAD
              echo ""
              echo "=== Checking all lines without semicolons ==="
              grep -n '= [^{/][^;]*$' Blink.xcodeproj/project.pbxproj | grep -v '/\*' | grep -v '^$' | head -20
              
              # Nuclear option: try reverting pbxproj and only applying minimal patches
              echo ""
              echo "=== NUCLEAR: Reverting to original pbxproj ==="
              git checkout -- Blink.xcodeproj/project.pbxproj
              
              # Apply only essential patches manually
              sed -i '' 's/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = ""/g' Blink.xcodeproj/project.pbxproj
              
              echo "=== Final validation ==="
              plutil -lint Blink.xcodeproj/project.pbxproj
            }
          }
          echo "✅ Project file is valid!"

      - name: "🔨 Build Blink Shell"
        run: |
          cd builder/blink-src
          
          echo "============================================"
          echo "  Building Blink Shell (xcodebuild)"
          echo "============================================"
          
          # Clear caches
          rm -rf ~/Library/Caches/org.swift.swiftpm 2>/dev/null || true
          
          # Resolve packages first
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -resolvePackageDependencies \
            -skipPackagePluginValidation \
            -skipMacroValidation 2>&1 | tail -20
          
          echo ""
          echo "=== Starting build ==="
          
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build-output/DerivedData \
            CONFIGURATION_BUILD_DIR=../build-output/Products \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            DEAD_CODE_STRIPPING=NO \
            ENABLE_PREVIEWS=NO \
            clean build 2>&1 | tee ../build.log | tail -50
          
          echo ""
          echo "=== Build exit code: ${PIPESTATUS[0]} ==="
          echo "=== Searching for .app ==="
          find ../build-output -name "*.app" -type d 2>/dev/null

      - name: "📱 Package IPA"
        if: always()
        run: |
          cd builder
          
          # Find .app
          APP=$(find build-output -name "Blink.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP" ]; then
            APP=$(find . -name "*.app" -type d -not -path "*/Intermediates*" 2>/dev/null | head -1)
          fi
          
          if [ -z "$APP" ]; then
            echo "❌ No .app found"
            echo "=== build.log tail ==="
            tail -80 build.log 2>/dev/null
            exit 1
          fi
          
          echo "✅ Found: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          
          VERSION="${{ github.event.inputs.version }}"
          zip -r "../Blink-unsigned-${VERSION}.ipa" Payload/
          ls -lh "../Blink-unsigned-${VERSION}.ipa"

      - name: "📤 Upload IPA"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-IPA-${{ github.event.inputs.version }}
          path: "Blink-unsigned-*.ipa"
          retention-days: 30

      - name: "📤 Upload Logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            builder/build.log
            builder/setup.log
            builder/build-output/**/*.log
          retention-days: 7
