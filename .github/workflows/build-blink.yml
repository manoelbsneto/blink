name: Build Blink Shell IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Blink version tag'
        required: false
        default: 'v18.4.2'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: "Setup Xcode 16"
        run: |
          # Xcode 16 on macos-15 has native visionOS support
          xcodebuild -version
          swift --version
          # Download visionOS platform if not present
          xcodebuild -downloadPlatform visionOS 2>&1 || echo "visionOS platform download skipped"

      - name: "Install jq"
        run: brew install jq || true

      - name: "Clone + Setup"
        run: |
          git clone https://github.com/NewsGuyTor/Blink-Shell-GPL-Builder.git builder
          cd builder
          chmod +x build-blink-shell-gpl.sh
          ./build-blink-shell-gpl.sh --setup-only --overwrite --keep-source --version "${{ github.event.inputs.version }}" 2>&1 | tee setup.log

      - name: "Fix project file"
        run: |
          cd builder/blink-src
          
          echo "=== plutil check ==="
          plutil -lint Blink.xcodeproj/project.pbxproj && echo "✅ Valid" && exit 0
          
          echo "⚠️ Invalid! Reverting to original + minimal patch"
          git checkout -- Blink.xcodeproj/project.pbxproj
          
          # Only change DEVELOPMENT_TEAM (minimal patch)
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = ""/g' Blink.xcodeproj/project.pbxproj
          
          plutil -lint Blink.xcodeproj/project.pbxproj
          echo "✅ Fixed"

      - name: "Build"
        run: |
          cd builder/blink-src
          
          # Clear caches
          rm -rf ~/Library/Caches/org.swift.swiftpm 2>/dev/null || true
          
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build-output/DerivedData \
            CONFIGURATION_BUILD_DIR=../build-output/Products \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            DEAD_CODE_STRIPPING=NO \
            ENABLE_PREVIEWS=NO \
            build 2>&1 | tee ../build.log
          
          echo "=== Exit: ${PIPESTATUS[0]} ==="
          find ../build-output -name "*.app" -type d

      - name: "Package IPA"
        if: success()
        run: |
          cd builder
          APP=$(find build-output -name "Blink.app" -type d | head -1)
          [ -z "$APP" ] && { echo "❌ No .app"; exit 1; }
          echo "✅ $APP"
          mkdir -p Payload dist
          cp -r "$APP" Payload/
          zip -r "dist/Blink-unsigned-${{ github.event.inputs.version }}.ipa" Payload/
          ls -lh dist/

      - name: "Upload IPA"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-IPA
          path: builder/dist/*.ipa
          retention-days: 30

      - name: "Upload Logs"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: builder/build.log
          retention-days: 7
