name: Build Blink Shell IPA (GPL Builder)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Blink version tag (e.g. v18.4.2)'
        required: false
        default: 'v18.4.2'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: "🔧 Environment Info"
        run: |
          echo "=== macOS ==="
          sw_vers
          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== Disk Space ==="
          df -h /

      - name: "📦 Install Dependencies"
        run: |
          brew install jq || true
          python3 --version
          git --version

      - name: "📥 Clone GPL Builder"
        run: |
          git clone https://github.com/NewsGuyTor/Blink-Shell-GPL-Builder.git builder
          cd builder
          ls -la
          echo ""
          echo "=== Builder script ==="
          head -50 build-blink-shell-gpl.sh

      - name: "🔨 Run GPL Build Script"
        run: |
          cd builder
          chmod +x build-blink-shell-gpl.sh

          VERSION="${{ github.event.inputs.version }}"
          echo "Building Blink Shell $VERSION..."

          # Run the community build script
          ./build-blink-shell-gpl.sh --build --keep-build --keep-source --version "$VERSION" 2>&1 | tee build.log

          echo ""
          echo "=== Build Complete ==="
          ls -lh dist/ 2>/dev/null || echo "No dist directory found"

      - name: "📦 Verify IPA"
        if: success()
        run: |
          cd builder
          echo "=== IPA Files ==="
          find . -name "*.ipa" -type f -exec ls -lh {} \;
          
          # Copy to workspace root for upload
          cp dist/*.ipa ../ 2>/dev/null || find . -name "*.ipa" -exec cp {} ../ \;
          ls -lh ../*.ipa

      - name: "📤 Upload IPA Artifact"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-IPA-${{ github.event.inputs.version }}
          path: "*.ipa"
          retention-days: 30

      - name: "📤 Upload Build Logs (on failure)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            builder/build.log
            builder/build-output/**/*.log
          retention-days: 7
