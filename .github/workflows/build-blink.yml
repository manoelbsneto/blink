name: Build Blink Shell IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Blink version tag'
        required: false
        default: 'v18.4.2'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: "Setup Xcode"
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s $(ls -d /Applications/Xcode*.app | tail -1)
          xcodebuild -version
          swift --version

      - name: "Install jq"
        run: brew install jq || true

      - name: "Clone + Setup source"
        run: |
          git clone https://github.com/NewsGuyTor/Blink-Shell-GPL-Builder.git builder
          cd builder
          chmod +x build-blink-shell-gpl.sh
          ./build-blink-shell-gpl.sh --setup-only --overwrite --keep-source --version "${{ github.event.inputs.version }}" 2>&1 | tee setup.log
          
          # Fix pbxproj if needed
          cd blink-src
          plutil -lint Blink.xcodeproj/project.pbxproj || {
            git checkout -- Blink.xcodeproj/project.pbxproj
            sed -i '' 's/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = ""/g' Blink.xcodeproj/project.pbxproj
          }

      - name: "Resolve packages + Patch visionOS"
        run: |
          cd builder/blink-src
          
          # Step 1: Clear ALL SPM caches
          rm -rf ~/Library/Caches/org.swift.swiftpm 2>/dev/null || true
          rm -rf ~/Library/org.swift.swiftpm 2>/dev/null || true
          
          # Step 2: Try to resolve (will fail on visionOS but downloads packages)
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -resolvePackageDependencies \
            -skipPackagePluginValidation \
            -skipMacroValidation 2>&1 || echo "Expected failure during resolve"
          
          # Step 3: Patch visionOS from ALL Package.swift files EVERYWHERE
          echo ""
          echo "=== Patching visionOS from ALL locations ==="
          
          # Patch in SourcePackages checkouts
          find ../build-output -name "Package.swift" 2>/dev/null | while read f; do
            if grep -q "visionOS" "$f" 2>/dev/null; then
              echo "Patching: $f"
              sed -i '' '/\.visionOS/d' "$f"
            fi
          done
          
          # Patch in DerivedData SourcePackages
          find ../build-output/DerivedData -name "Package.swift" 2>/dev/null | while read f; do
            if grep -q "visionOS" "$f" 2>/dev/null; then
              echo "Patching: $f"
              sed -i '' '/\.visionOS/d' "$f"
            fi
          done
          
          # Patch in SPM global cache
          find ~/Library/Caches/org.swift.swiftpm -name "Package.swift" 2>/dev/null | while read f; do
            if grep -q "visionOS" "$f" 2>/dev/null; then
              echo "Patching SPM cache: $f"
              sed -i '' '/\.visionOS/d' "$f"
            fi
          done
          
          # Patch in SPM SourcePackages inside project
          find . -path "*/SourcePackages/checkouts/*/Package.swift" 2>/dev/null | while read f; do
            if grep -q "visionOS" "$f" 2>/dev/null; then
              echo "Patching checkout: $f"
              sed -i '' '/\.visionOS/d' "$f"
            fi
          done
          
          # NUCLEAR: find ALL Package.swift anywhere under home and build dirs
          for dir in ~/Library/Caches ~/Library/Developer "$PWD" "../build-output"; do
            find "$dir" -name "Package.swift" -maxdepth 10 2>/dev/null | while read f; do
              if grep -q "\.visionOS" "$f" 2>/dev/null; then
                echo "NUCLEAR patch: $f"
                sed -i '' '/\.visionOS/d' "$f"
              fi
            done
          done
          
          # Step 4: Clear manifest compilation cache (forces recompilation)
          rm -rf ~/Library/Caches/org.swift.swiftpm/manifests 2>/dev/null || true
          find ~/Library -path "*/ManifestLoading/*cached-async*" -delete 2>/dev/null || true
          
          # Step 5: Re-resolve packages (should work now)
          echo ""
          echo "=== Re-resolving packages after patch ==="
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -resolvePackageDependencies \
            -skipPackagePluginValidation \
            -skipMacroValidation 2>&1 | tail -20
          
          echo "✅ Package resolution complete"

      - name: "Build"
        run: |
          cd builder/blink-src
          
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build-output/DerivedData \
            CONFIGURATION_BUILD_DIR=../build-output/Products \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            DEAD_CODE_STRIPPING=NO \
            ENABLE_PREVIEWS=NO \
            build 2>&1 | tee ../build.log
          
          echo "=== Exit: ${PIPESTATUS[0]} ==="

      - name: "Package IPA"
        if: success()
        run: |
          cd builder
          APP=$(find build-output -name "Blink.app" -type d | head -1)
          [ -z "$APP" ] && { echo "❌ No .app"; exit 1; }
          echo "✅ $APP"
          mkdir -p Payload dist
          cp -r "$APP" Payload/
          zip -r "dist/Blink-unsigned-${{ github.event.inputs.version }}.ipa" Payload/
          ls -lh dist/

      - name: "Upload IPA"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-IPA
          path: builder/dist/*.ipa
          retention-days: 30

      - name: "Upload Logs"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: builder/build.log
          retention-days: 7
