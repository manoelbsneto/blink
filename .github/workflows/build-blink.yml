name: Build Blink Shell IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Blink version tag'
        required: false
        default: 'v18.4.2'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: "Select Xcode 15.4"
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s $(ls -d /Applications/Xcode*.app | tail -1)
          xcodebuild -version
          swift --version

      - name: "Install jq"
        run: brew install jq || true

      - name: "Clone GPL Builder + Setup"
        run: |
          git clone https://github.com/NewsGuyTor/Blink-Shell-GPL-Builder.git builder
          cd builder
          chmod +x build-blink-shell-gpl.sh
          
          # Setup only - clone and patch
          ./build-blink-shell-gpl.sh \
            --setup-only \
            --overwrite \
            --keep-source \
            --version "${{ github.event.inputs.version }}" 2>&1 | tee setup.log
          
          echo "✅ Setup complete"
          ls -la blink-src/Blink.xcodeproj/project.pbxproj

      - name: "Patch visionOS compatibility"
        run: |
          cd builder/blink-src
          
          echo "=== Validating pbxproj ==="
          plutil -lint Blink.xcodeproj/project.pbxproj || {
            echo "Reverting and minimal patching pbxproj..."
            git checkout -- Blink.xcodeproj/project.pbxproj
            sed -i '' 's/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = ""/g' Blink.xcodeproj/project.pbxproj
            plutil -lint Blink.xcodeproj/project.pbxproj
          }
          
          echo ""
          echo "=== Resolving SPM packages ==="
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -resolvePackageDependencies \
            -skipPackagePluginValidation \
            -skipMacroValidation 2>&1 | tail -10 || true
          
          echo ""
          echo "=== Patching visionOS from dependencies ==="
          
          # Find and fix ALL Package.swift files with visionOS references
          # that have a swift-tools-version below 5.9
          find ../build-output -name "Package.swift" -path "*/checkouts/*" 2>/dev/null | while read pkg; do
            if grep -q "visionOS" "$pkg" 2>/dev/null; then
              TOOLS_VER=$(head -1 "$pkg" | grep -oE '[0-9]+\.[0-9]+')
              echo "Found visionOS in: $pkg (tools: $TOOLS_VER)"
              
              # Remove .visionOS lines
              sed -i '' '/\.visionOS/d' "$pkg"
              echo "  ✅ Removed .visionOS"
            fi
          done
          
          # Also check SourcePackages path
          find ../build-output -name "Package.swift" -path "*/SourcePackages/*" 2>/dev/null | while read pkg; do
            if grep -q "visionOS" "$pkg" 2>/dev/null; then
              echo "Found visionOS in: $pkg"
              sed -i '' '/\.visionOS/d' "$pkg"
              echo "  ✅ Removed .visionOS"
            fi
          done
          
          echo ""
          echo "=== Patches applied ==="

      - name: "Build Blink Shell"
        run: |
          cd builder/blink-src
          
          echo "============================================"
          echo "  Building Blink Shell"
          echo "============================================"
          
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build-output/DerivedData \
            CONFIGURATION_BUILD_DIR=../build-output/Products \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            DEAD_CODE_STRIPPING=NO \
            ENABLE_PREVIEWS=NO \
            clean build 2>&1 | tee ../build.log
          
          BUILD_RESULT=${PIPESTATUS[0]}
          echo ""
          echo "=== Build exit code: $BUILD_RESULT ==="
          
          if [ "$BUILD_RESULT" -ne 0 ]; then
            echo "❌ Build failed"
            tail -50 ../build.log
            exit 1
          fi
          
          echo "=== Searching for .app ==="
          find ../build-output -name "*.app" -type d

      - name: "Package IPA"
        run: |
          cd builder
          APP=$(find build-output -name "Blink.app" -type d | head -1)
          
          if [ -z "$APP" ]; then
            echo "❌ No Blink.app found"
            find build-output -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          
          echo "✅ Found: $APP"
          mkdir -p Payload dist
          cp -r "$APP" Payload/
          
          VERSION="${{ github.event.inputs.version }}"
          zip -r "dist/Blink-unsigned-${VERSION}.ipa" Payload/
          ls -lh dist/

      - name: "Upload IPA"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-IPA
          path: builder/dist/*.ipa
          retention-days: 30

      - name: "Upload Logs"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: builder/build.log
          retention-days: 7
