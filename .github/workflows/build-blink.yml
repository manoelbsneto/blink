name: Build Blink Shell IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Blink version tag'
        required: false
        default: 'v18.4.2'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: "Setup Xcode 16"
        run: |
          xcodebuild -version
          swift --version

      - name: "Install jq"
        run: brew install jq || true

      - name: "Clone + Setup"
        run: |
          git clone https://github.com/NewsGuyTor/Blink-Shell-GPL-Builder.git builder
          cd builder
          chmod +x build-blink-shell-gpl.sh
          ./build-blink-shell-gpl.sh --setup-only --overwrite --keep-source --version "${{ github.event.inputs.version }}" 2>&1 | tee setup.log

      - name: "Fix pbxproj + Pin dependencies"
        run: |
          cd builder/blink-src
          
          # 1. Fix pbxproj
          echo "=== Fixing pbxproj ==="
          plutil -lint Blink.xcodeproj/project.pbxproj || {
            echo "Reverting + minimal patch"
            git checkout -- Blink.xcodeproj/project.pbxproj
            sed -i '' 's/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = ""/g' Blink.xcodeproj/project.pbxproj
            plutil -lint Blink.xcodeproj/project.pbxproj
          }
          
          # 2. Pin swiftui-cached-async-image to 2.1.1 (no visionOS)
          echo ""
          echo "=== Downgrading swiftui-cached-async-image to 2.1.1 ==="
          
          # Find and update Package.resolved
          RESOLVED=$(find . -name "Package.resolved" -path "*/Blink*" | head -1)
          if [ -z "$RESOLVED" ]; then
            RESOLVED=$(find . -name "Package.resolved" | head -1)
          fi
          
          if [ -n "$RESOLVED" ]; then
            echo "Found: $RESOLVED"
            # Replace the version and revision for swiftui-cached-async-image
            # Pin to 2.1.1 commit
            if grep -q "swiftui-cached-async-image" "$RESOLVED"; then
              echo "Patching swiftui-cached-async-image to 2.1.1..."
              python3 -c "
import json, sys

with open('$RESOLVED', 'r') as f:
    data = json.load(f)

pins = data.get('pins', data.get('object', {}).get('pins', []))
for pin in pins:
    identity = pin.get('identity', pin.get('package', ''))
    if 'cached-async-image' in identity.lower():
        state = pin.get('state', {})
        state['version'] = '2.1.1'
        # Clear revision to force re-resolve to 2.1.1
        if 'revision' in state:
            state['revision'] = None
        pin['state'] = state
        print(f'Pinned {identity} to 2.1.1')
        break

with open('$RESOLVED', 'w') as f:
    json.dump(data, f, indent=2)
"
              echo "âœ… Package.resolved updated"
              grep -A3 "cached-async" "$RESOLVED"
            fi
          else
            echo "No Package.resolved found"
          fi
          
          # 3. Also try to modify the Package.swift dependency if it exists
          if [ -f "Package.swift" ]; then
            echo ""
            echo "=== Checking Package.swift ==="
            grep "cached-async" Package.swift || echo "Not in Package.swift"
          fi

      - name: "Build"
        run: |
          cd builder/blink-src
          
          # Clear SPM cache
          rm -rf ~/Library/Caches/org.swift.swiftpm 2>/dev/null || true
          
          echo "============================================"
          echo "  Building Blink Shell (Xcode 16)"
          echo "============================================"
          
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath ../build-output/DerivedData \
            CONFIGURATION_BUILD_DIR=../build-output/Products \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            DEAD_CODE_STRIPPING=NO \
            ENABLE_PREVIEWS=NO \
            build 2>&1 | tee ../build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== Build exit: $BUILD_EXIT ==="
          
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "âŒ Build failed"
            tail -50 ../build.log
            exit 1
          fi
          
          find ../build-output -name "*.app" -type d

      - name: "Package IPA"
        if: success()
        run: |
          cd builder
          APP=$(find build-output -name "Blink.app" -type d | head -1)
          [ -z "$APP" ] && { echo "âŒ No .app"; exit 1; }
          echo "âœ… $APP"
          mkdir -p Payload dist
          cp -r "$APP" Payload/
          zip -r "dist/Blink-unsigned-${{ github.event.inputs.version }}.ipa" Payload/
          ls -lh dist/

      - name: "Upload IPA"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-IPA
          path: builder/dist/*.ipa
          retention-days: 30

      - name: "Upload Logs"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: builder/build.log
          retention-days: 7
