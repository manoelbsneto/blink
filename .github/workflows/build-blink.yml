name: Build Blink Shell IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Blink version tag'
        required: false
        default: 'v18.4.2'
      xcode_version:
        description: 'Xcode version to use'
        required: false
        default: '15.2'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: "Select Xcode"
        run: |
          # List available Xcode versions
          ls /Applications/ | grep Xcode
          
          XCODE_VER="${{ github.event.inputs.xcode_version }}"
          XCODE_PATH="/Applications/Xcode_${XCODE_VER}.app"
          
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Xcode $XCODE_VER not found, using default"
            XCODE_PATH=$(ls -d /Applications/Xcode*.app | head -1)
          fi
          
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          swift --version

      - name: "Install jq"
        run: brew install jq || true

      - name: "Clone and Build (GPL Builder)"
        run: |
          git clone https://github.com/NewsGuyTor/Blink-Shell-GPL-Builder.git builder
          cd builder
          chmod +x build-blink-shell-gpl.sh
          
          # Let the script do EVERYTHING
          # --keep-source --keep-build for debugging
          ./build-blink-shell-gpl.sh \
            --overwrite \
            --clean \
            --keep-source \
            --keep-build \
            --version "${{ github.event.inputs.version }}" || {
              EXIT_CODE=$?
              echo ""
              echo "❌ GPL Builder failed with exit code: $EXIT_CODE"
              echo ""
              echo "=== build.log (last 200 lines) ==="
              tail -200 build-output/build.log 2>/dev/null || echo "No build.log found"
              echo ""
              echo "=== Checking for .app anyway ==="
              find . -name "*.app" -type d 2>/dev/null || echo "No .app found"
              echo ""
              echo "=== plutil check ==="
              plutil -lint blink-src/Blink.xcodeproj/project.pbxproj 2>/dev/null || echo "plutil failed"
              exit $EXIT_CODE
            }
          
          echo ""
          echo "✅ Build succeeded!"
          ls -lh dist/

      - name: "Upload IPA"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-IPA
          path: builder/dist/*.ipa
          retention-days: 30

      - name: "Upload Logs"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            builder/build-output/build.log
          retention-days: 7
