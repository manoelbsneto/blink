name: Build Blink Shell IPA

on:
  push:
    branches: [raw]
    paths: ['.github/workflows/blink-ipa.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Blink version tag
        required: false
        default: v18.4.2

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BLINK_VERSION: ${{ github.event.inputs.version || 'v18.4.2' }}

    steps:
      - name: Setup Xcode 16
        run: |
          xcodebuild -version
          swift --version

      - name: Install jq
        run: brew install jq || true

      - name: Clone and Setup
        run: |
          git clone https://github.com/NewsGuyTor/Blink-Shell-GPL-Builder.git builder
          cd builder
          chmod +x build-blink-shell-gpl.sh
          ./build-blink-shell-gpl.sh --setup-only --overwrite --keep-source --version "$BLINK_VERSION" 2>&1 | tee setup.log

      - name: Fix pbxproj
        run: |
          cd builder/blink-src
          plutil -lint Blink.xcodeproj/project.pbxproj || {
            echo "Reverting and patching pbxproj"
            git checkout -- Blink.xcodeproj/project.pbxproj
            sed -i '' 's/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = ""/g' Blink.xcodeproj/project.pbxproj
            plutil -lint Blink.xcodeproj/project.pbxproj
          }

      - name: Resolve and patch dependencies
        run: |
          cd builder/blink-src

          # Clear stale SPM caches
          rm -rf ~/Library/Caches/org.swift.swiftpm 2>/dev/null || true

          # Step 1: Resolve packages (will fail on visionOS but downloads everything)
          echo "=== Resolving packages (expect failure) ==="
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -resolvePackageDependencies \
            -skipPackagePluginValidation \
            -skipMacroValidation 2>&1 || echo "Expected failure - packages downloaded"

          # Step 2: Find and patch the swiftui-cached-async-image Package.swift
          echo ""
          echo "=== Patching dependency manifests ==="

          # Find in DerivedData checkouts
          find ../build-output -name "Package.swift" -path "*checkouts*" 2>/dev/null | while read f; do
            if grep -q "visionOS" "$f" 2>/dev/null; then
              echo "Patching: $f"
              # Upgrade swift-tools-version to 5.9 AND keep visionOS
              sed -i '' '1s/swift-tools-version:[0-9.]*/swift-tools-version:5.9/' "$f"
              echo "  -> upgraded to swift-tools-version:5.9"
              head -1 "$f"
            fi
          done

          # Also find in Xcode SourcePackages
          find . -name "Package.swift" -path "*SourcePackages*checkouts*" 2>/dev/null | while read f; do
            if grep -q "visionOS" "$f" 2>/dev/null; then
              echo "Patching SourcePackages: $f"
              sed -i '' '1s/swift-tools-version:[0-9.]*/swift-tools-version:5.9/' "$f"
              head -1 "$f"
            fi
          done

          # Step 3: Clear the manifest compilation cache so SPM recompiles
          echo ""
          echo "=== Clearing manifest cache ==="
          rm -rf ~/Library/Caches/org.swift.swiftpm/manifests 2>/dev/null || true
          find ~/Library/Caches -name "*cached-async-image*" -delete 2>/dev/null || true
          find /var/folders -name "*cached-async-image*manifest*" -delete 2>/dev/null || true

          # Step 4: Re-resolve (should work now with 5.9 tools version)
          echo ""
          echo "=== Re-resolving packages ==="
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -resolvePackageDependencies \
            -skipPackagePluginValidation \
            -skipMacroValidation 2>&1 | tail -20

          echo "Package resolution done"

      - name: Build
        run: |
          cd builder/blink-src
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath ../build-output/DerivedData \
            CONFIGURATION_BUILD_DIR=../build-output/Products \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
            DEAD_CODE_STRIPPING=NO \
            ENABLE_PREVIEWS=NO \
            build 2>&1 | tee ../build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT"
          if [ "$BUILD_EXIT" -ne 0 ]; then
            tail -80 ../build.log
            exit 1
          fi
          find ../build-output -name "*.app" -type d

      - name: Package IPA
        if: success()
        run: |
          cd builder
          APP=$(find build-output -name "Blink.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "No app found"; exit 1; fi
          echo "Found $APP"
          mkdir -p Payload dist
          cp -r "$APP" Payload/
          zip -r "dist/Blink-unsigned-${BLINK_VERSION}.ipa" Payload/
          ls -lh dist/

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-IPA
          path: builder/dist/*.ipa
          retention-days: 30

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: builder/build.log
          retention-days: 7
