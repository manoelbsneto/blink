name: Build Blink Shell IPA
on:
  push:
    branches:
      - raw
    paths:
      - .github/workflows/blink-ipa.yml
  workflow_dispatch:
    inputs:
      version:
        description: Blink version tag
        required: false
        default: v18.4.2
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BLINK_VERSION: v18.4.2
    steps:
      - name: Setup Xcode
        run: |
          xcodebuild -version
          swift --version
      - name: Install tools
        run: brew install jq || true
      - name: Clone and setup source
        run: |
          git clone https://github.com/NewsGuyTor/Blink-Shell-GPL-Builder.git builder
          cd builder
          chmod +x build-blink-shell-gpl.sh
          ./build-blink-shell-gpl.sh --setup-only --overwrite --keep-source --version "$BLINK_VERSION" 2>&1 | tee setup.log
      - name: Fix project and redirect deps
        run: |
          cd builder/blink-src
          echo "=== Fix pbxproj ==="
          git checkout -- Blink.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = ""/g' Blink.xcodeproj/project.pbxproj
          plutil -lint Blink.xcodeproj/project.pbxproj

          echo "=== Redirect cached-async-image to fixed fork ==="
          grep -rl "lorenzofiamingo/swiftui-cached-async-image" . \
            --include="*.pbxproj" --include="*.swift" --include="*.resolved" 2>/dev/null \
            | while read f; do
                echo "Patching: $f"
                sed -i '' 's|lorenzofiamingo/swiftui-cached-async-image|manoelbsneto/swiftui-cached-async-image|g' "$f"
              done

          echo "=== Patch iOS 26 APIs for Xcode 16.4 compatibility ==="
          KBFILE="Blink/SmarterKeys/KBAccessoryView.swift"
          if [ -f "$KBFILE" ] && grep -q "UIGlassEffect" "$KBFILE"; then
            echo "Stubbing iOS 26 UIGlassEffect APIs..."
            python3 - "$KBFILE" << 'PYEOF'
import sys, re

path = sys.argv[1]
with open(path, 'r') as f:
    content = f.read()

# Wrap @available(iOS 26.0, *) functions with #if compiler guard
# This makes them invisible to Xcode 16.4 which uses Swift 5.x compiler
lines = content.split('\n')
new_lines = []
i = 0
in_block = False
brace_depth = 0
skip_until_close = False

while i < len(lines):
    line = lines[i]

    # Detect @available(iOS 26 pattern followed by func
    if '@available(iOS 26' in line and not in_block:
        # Check next line for func
        if i + 1 < len(lines) and ('func _createGlassEffect' in lines[i+1] or
                                     'func _setupGlassMaterial' in lines[i+1]):
            new_lines.append('  #if compiler(>=6.2)')
            new_lines.append(line)
            skip_until_close = True
            brace_depth = 0
            i += 1
            continue

    if skip_until_close:
        new_lines.append(line)
        brace_depth += line.count('{') - line.count('}')
        if brace_depth <= 0 and '{' not in line and '}' in line:
            # Check if we closed the function
            stripped = line.strip()
            if stripped == '}':
                new_lines.append('  #endif')
                skip_until_close = False
        elif brace_depth < 0:
            new_lines.append('  #endif')
            skip_until_close = False
        i += 1
        continue

    # Handle UIGlassEffect type in property declarations
    if 'UIGlassEffect' in line and '@available' not in line and 'func' not in line:
        new_lines.append('  #if compiler(>=6.2)')
        new_lines.append(line)
        new_lines.append('  #endif')
        i += 1
        continue

    # Handle cornerConfiguration
    if 'cornerConfiguration' in line and '@available' not in line:
        new_lines.append('  #if compiler(>=6.2)')
        new_lines.append(line)
        new_lines.append('  #endif')
        i += 1
        continue

    new_lines.append(line)
    i += 1

with open(path, 'w') as f:
    f.write('\n'.join(new_lines))

print(f"Patched {path}")
PYEOF
          fi

          echo "=== Verify redirect ==="
          grep -r "cached-async-image" . --include="*.pbxproj" --include="*.resolved" | head -3
          echo "Done"
      - name: Build
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/builder/build-output"
          cd builder/blink-src
          rm -rf ~/Library/Caches/org.swift.swiftpm 2>/dev/null || true
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$BUILD_DIR/DerivedData" \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR/Products" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEAD_CODE_STRIPPING=NO \
            ENABLE_PREVIEWS=NO \
            build 2>&1 | tee ../build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit: $BUILD_EXIT"
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "=== ERRORS ==="
            grep " error: " ../build.log | sort -u | head -20
            echo "=== LAST 40 LINES ==="
            tail -40 ../build.log
            exit 1
          fi
          find "$BUILD_DIR/Products" -name "*.app" -type d
      - name: Package IPA
        if: success()
        run: |
          cd builder
          APP=$(find build-output -name "Blink.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "No app found"; exit 1; fi
          echo "Found: $APP"
          mkdir -p Payload dist
          cp -r "$APP" Payload/
          cd Payload && zip -r ../dist/Blink-unsigned.ipa Blink.app && cd ..
          ls -lh dist/
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-IPA
          path: builder/dist/*.ipa
          retention-days: 30
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: builder/build.log
          retention-days: 7