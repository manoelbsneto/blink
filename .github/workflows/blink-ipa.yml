name: Build Blink Shell IPA
on:
  push:
    branches:
      - raw
    paths:
      - .github/workflows/blink-ipa.yml
  workflow_dispatch:
    inputs:
      version:
        description: Blink version tag
        required: false
        default: v18.4.2
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BLINK_VERSION: v18.4.2
    steps:
      - name: Setup Xcode
        run: |
          xcodebuild -version
          swift --version
      - name: Install tools
        run: brew install jq || true
      - name: Clone and setup source
        run: |
          git clone https://github.com/NewsGuyTor/Blink-Shell-GPL-Builder.git builder
          cd builder
          chmod +x build-blink-shell-gpl.sh
          ./build-blink-shell-gpl.sh --setup-only --overwrite --keep-source --version "$BLINK_VERSION" 2>&1 | tee setup.log
      - name: Fix project and redirect deps
        run: |
          cd builder/blink-src
          echo "=== Fix pbxproj ==="
          git checkout -- Blink.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = ""/g' Blink.xcodeproj/project.pbxproj
          plutil -lint Blink.xcodeproj/project.pbxproj
          echo "=== Redirect ALL refs to cached-async-image fork ==="
          grep -rl "lorenzofiamingo/swiftui-cached-async-image" . --include="*.pbxproj" --include="*.swift" --include="*.resolved" 2>/dev/null | while read f; do
            echo "Patching: $f"
            sed -i '' 's|lorenzofiamingo/swiftui-cached-async-image|manoelbsneto/swiftui-cached-async-image|g' "$f"
          done
          echo "=== Verify redirect ==="
          grep -r "cached-async-image" . --include="*.pbxproj" --include="*.resolved" | head -5
          echo "Done"
      - name: Build
        run: |
          cd builder/blink-src
          DERIVED="$GITHUB_WORKSPACE/builder/build-output/DerivedData"
          BUILD_PRODUCTS="$GITHUB_WORKSPACE/builder/build-output/Products"
          rm -rf ~/Library/Caches/org.swift.swiftpm 2>/dev/null || true
          xcodebuild -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED" \
            CONFIGURATION_BUILD_DIR="$BUILD_PRODUCTS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
            DEAD_CODE_STRIPPING=NO \
            ENABLE_PREVIEWS=NO \
            build 2>&1 | tee ../build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit: $BUILD_EXIT"
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "=== LAST 80 LINES ==="
            tail -80 ../build.log
            exit 1
          fi
          find "$BUILD_PRODUCTS" -name "*.app" -type d
      - name: Package IPA
        if: success()
        run: |
          cd builder
          APP=$(find build-output -name "Blink.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "No app"; exit 1; fi
          mkdir -p Payload dist
          cp -r "$APP" Payload/
          zip -r dist/Blink-unsigned.ipa Payload/
          ls -lh dist/
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-IPA
          path: builder/dist/*.ipa
          retention-days: 30
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: builder/build.log
          retention-days: 7